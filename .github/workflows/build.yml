name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release build must never be cancelled while it produces artifacts.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install Linux native build/test dependencies
        run: |
          # the runner image ships apt lists that are older than the mirror pool, so the
          # version the lists name can already be gone from the pool and the install
          # 404s. refresh the lists on every run, and skip the translation indexes:
          # they are a sixth of the index traffic and nothing here needs them.
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsystemd-dev dbus
      - run: bun install --frozen-lockfile
      - name: Install Electron before parallel tests
        run: bunx install-electron --no
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run test:native-portal

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            command: bun run dist:arch
          - os: ubuntu-22.04-arm
            command: bun run dist:arch
          - os: windows-latest
            command: bun run dist:win
          - os: macos-latest
            command: bun run dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Cache Electron downloads
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Cache Electron downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Cache electron-builder downloads
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Cache electron-builder downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Linux packaging and native dependencies
        if: runner.os == 'Linux'
        run: |
          # the runner image ships apt lists that are older than the mirror pool, so the
          # version the lists name can already be gone from the pool and the install
          # 404s. refresh the lists on every run, and skip the translation indexes:
          # they are a sixth of the index traffic and nothing here needs them.
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsystemd-dev dbus libarchive-tools
      - name: Native portal helper tests (private D-Bus)
        if: runner.os == 'Linux'
        run: bun run test:native-portal
      - name: Package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Linux native package contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x64
              channel=latest-linux.yml
              ;;
            aarch64)
              arch=arm64
              channel=latest-linux-arm64.yml
              ;;
            *)
              echo "Unexpected Linux runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          test -s "release/$channel"
          python3 - "$arch" <<'PY'
          import hashlib, os, pathlib, subprocess, sys
          arch = sys.argv[1]
          name = f'portal-metadata-linux-{arch}'
          built = pathlib.Path('native/out') / name
          helpers = list(pathlib.Path('release').glob(f'linux*-unpacked/resources/native/{name}'))
          assert len(helpers) == 1, helpers
          assert os.access(helpers[0], os.X_OK), helpers[0]
          expected = built.read_bytes()
          assert helpers[0].read_bytes() == expected, 'unpacked helper differs from build'
          archives = list(pathlib.Path('release').glob('*.pacman'))
          assert len(archives) == 1, archives
          archive = archives[0]
          assert not list(pathlib.Path('release').glob('*.AppImage')), 'AppImage is no longer a Linux target'
          assert not list(pathlib.Path('release').glob('*.deb')), 'deb is no longer a Linux target'
          data = archive.read_bytes()
          info = subprocess.check_output(['bsdtar', '-xOf', '-', '.PKGINFO'], input=data).decode()
          assert 'pkgname = dodecagon-desktop' in info, info
          assert 'depend = http-parser' not in info, 'http-parser is not in the Arch repositories'
          assert 'depend = libappindicator-gtk3' not in info, 'Arch names the package libappindicator'
          suffix = f'/resources/native/{name}'
          entries = subprocess.check_output(['bsdtar', '-tf', '-'], input=data).decode().splitlines()
          members = [entry for entry in entries if entry.endswith(suffix)]
          assert len(members) == 1, (archive, members)
          member = members[0]
          actual = subprocess.check_output(['bsdtar', '-xOf', '-', member], input=data)
          assert actual == expected, f'{archive}: packaged helper differs from build'
          print(f'{archive.name}: verified {member} sha256={hashlib.sha256(actual).hexdigest()}')
          PY
      - name: Check Windows audio verification tools
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-audio-smoke.ps1 -CheckOnly
      - name: Verify native Windows background voice shortcuts
        if: runner.os == 'Windows'
        run: bun run test:windows-shortcuts
      - name: Upload Windows shortcut verification
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-shortcut-verification
          path: test-results/windows-shortcuts.json
          if-no-files-found: error
          # Already-compressed payloads: re-compressing them only costs time.
          compression-level: 0
      - name: Upload Windows audio verification kit
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-audio-verification
          path: |
            native/out/win-audio-capture.exe
            scripts/windows-audio-smoke.ps1
          if-no-files-found: error
          # Already-compressed payloads: re-compressing them only costs time.
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          # Installers only: release/* would also drag the unpacked app directories along.
          path: |
            release/*.exe
            release/*.pacman
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          # Installers are already compressed: compression level 0 only saves time.
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Show what will be published
        run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          generate_release_notes: true
